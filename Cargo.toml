[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
authors = ["OpenAttribution Contributors"]
license = "MIT"
repository = "https://github.com/openattribution-org/policycheck"
homepage = "https://openattribution.org"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
