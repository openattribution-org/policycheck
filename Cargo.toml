[package]
name = "policycheck"
version = "0.1.0"
edition = "2024"
authors = ["OpenAttribution Contributors"]
description = "Publisher policy compliance checker - verifies robots.txt, RSL licenses, and TDM policies"
license = "MIT"
repository = "https://github.com/openattribution-org/policycheck"
homepage = "https://openattribution.org"
keywords = ["robots", "rsl", "tdm", "policy", "compliance"]
categories = ["web-programming", "command-line-utilities"]

[dependencies]
texting_robots = "0.2"
reqwest = { version = "0.12", features = ["blocking"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
comfy-table = "7.1"
url = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
